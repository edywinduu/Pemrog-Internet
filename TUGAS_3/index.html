    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        section img {
            border: 2px solid black;
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
        }
        section img:hover {
            width: 230px;
            height: 230px;
            box-shadow: 0px 30px 100px 20px rgba(34, 100, 255, 0.30);
        }
        section table {
            width: 400px;
            min-height: 40px;
            padding: 4px 16px;
        }
        section table thead tr td{
            text-align: center;
        }
        .information-section div {
            align-items: center;
            padding: 4px 0;
        }
        .information-section div a {
            gap: 8px;
            text-decoration: none;
            transition: 0.3s;
        }
        .information-section div a:hover {
            opacity: 0.7;
        }
        .information-socialmedia {
            display: grid;
            grid-template-columns: 140px 140px; 
            column-gap: 24px;        /* Jarak celah di tengah */
            row-gap: 14px;           /* Jarak baris atas-bawah */
            justify-content: center; /* Posisikan grid tepat di tengah kartu */
            width: 100%;
        }

        .information-socialmedia a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            width: 100%;
        }

        .information-socialmedia a i {
            width: 28px;
            text-align: center;
            font-size: 24px;
        }

        .information-socialmedia > :nth-child(odd) {
            justify-content: flex-end;
        }

        .information-socialmedia > :nth-child(odd) span {
            width: 85px;       /* Sesuaikan agar pas dengan kata Whatsapp */
            text-align: left;  /* Huruf 'E' pada Email tetap lurus di bawah huruf 'W' */
        }

        .information-socialmedia > :nth-child(even) {
            justify-content: flex-start;
        }
    </style>
</head>
