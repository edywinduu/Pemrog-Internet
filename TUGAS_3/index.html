    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-height: 100vh;
        }
        section img {
            border: 2px solid black;
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
        }
        section img:hover {
            width: 230px;
            height: 230px;
            box-shadow: 0px 30px 100px 20px rgba(34, 100, 255, 0.10);
        }
        section table {
            min-width: 500px;
            min-height: 40px;
            padding: 4px 16px;
        }
        section table thead tr td{
            text-align: center;
        }
        .information-socialmedia {
            display: grid;
            grid-template-columns: 160px 160px; 
            column-gap: 24px;        /* Jarak celah di tengah */
            row-gap: 12px;           /* Jarak baris atas-bawah */
            justify-content: center; /* Posisikan grid tepat di tengah kartu */
            width: 100%;
            margin-top: 8px;
        }

        .information-socialmedia a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }

        .information-socialmedia a:hover {
            background-color: #f1f5f9;
            border-color: #e2e8f0;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .information-socialmedia a i {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            text-align: center;
        }

        .information-socialmedia a span {
            font-size: 18px;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            nav {
                padding: 12px 0;
                min-height: auto;
            }
            nav ul {
                gap: 0.5rem;
            }
            nav ul li a {
                font-size: 15px;
                padding: 6px 12px;
            }
        }
    </style>
</head>

            </a>
